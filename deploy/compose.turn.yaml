# Independent opt-in service. Does not alter app/database or other projects.
services:
  turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/clikiss/turn-entrypoint.sh"]
    environment:
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?Set the public IPv4 after checking firewall and ports}
      TURN_REALM: ${TURN_REALM:?Set the TURN DNS name}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Generate a separate random secret}
      TURN_TOTAL_QUOTA: ${TURN_TOTAL_QUOTA:-120}
      TURN_BPS_CAPACITY: ${TURN_BPS_CAPACITY:-6250000}
    volumes:
      - ./turn-entrypoint.sh:/opt/clikiss/turn-entrypoint.sh:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49559:49160-49559/udp"
    cpus: ${TURN_CPU_LIMIT:-1.0}
    mem_limit: ${TURN_MEMORY_LIMIT:-256m}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The official turnserver binary carries this file capability.
    cap_add: [NET_BIND_SERVICE]
