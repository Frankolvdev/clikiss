# LOCAL TEST ONLY. The dummy credential and loopback permission must never
# be used in production. All published ports bind exclusively to loopback.
services:
  turn-test:
    image: coturn/coturn:4.18.0-r0
    profiles: [video-test]
    entrypoint: ["/bin/sh", "/opt/clikiss/turn-test-entrypoint.sh"]
    volumes:
      - ./turn-test.conf:/opt/clikiss/turn-test.conf:ro
      - ./turn-test-entrypoint.sh:/opt/clikiss/turn-test-entrypoint.sh:ro
    ports:
      - "127.0.0.1:3479:3478/tcp"
      - "127.0.0.1:3479:3478/udp"
      - "127.0.0.1:49560-49599:49560-49599/udp"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    cpus: 1.0
    mem_limit: 256m
